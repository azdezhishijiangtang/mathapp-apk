name: build-apk

# 本地没有 JDK / Android SDK，所以 APK 只能在云端出。
# 手动触发一次即可：Actions → build-apk → Run workflow
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    name: APK（单文件完整版：外壳 + 引擎包）
    runs-on: ubuntu-latest
    needs: engine-pack
    steps:
      - uses: actions/checkout@v4

      - name: 取引擎包并放进 APK assets
        uses: actions/download-artifact@v4
        with:
          name: engine-pack
          path: android/app/src/main/assets

      - name: 核对引擎包已就位
        run: |
          ls -lh android/app/src/main/assets/
          test -f android/app/src/main/assets/rootfs.tar.gz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Android SDK 组件（用 runner 预装的 SDK，不装已废弃的 tools 包）
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: 安装依赖并同步原生工程
        run: |
          npm ci || npm install
          npx cap sync android

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mathapp-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  engine-pack:
    name: 引擎包（arm64 rootfs + 七引擎）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 准备 debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap

      - name: 造 rootfs.tar.gz
        run: |
          cd pack
          chmod +x build_engine_pack.sh
          ./build_engine_pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: engine-pack
          path: pack/rootfs.tar.gz*
          if-no-files-found: error
