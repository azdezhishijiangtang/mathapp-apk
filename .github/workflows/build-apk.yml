name: build-apk

# 本地没有 JDK / Android SDK，所以 APK 只能在云端出。
# 手动触发一次即可：Actions → build-apk → Run workflow
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    name: APK（单文件完整版：外壳 + 引擎包）
    runs-on: ubuntu-latest
    needs: engine-pack
    steps:
      - uses: actions/checkout@v4

      - name: 取引擎包并放进 APK assets
        uses: actions/download-artifact@v4
        with:
          name: engine-pack
          path: android/app/src/main/assets

      - name: 核对引擎包已就位
        run: |
          ls -lh android/app/src/main/assets/
          test -f android/app/src/main/assets/rootfs.tar.gz
          # 引擎版本号：APK 启动时与本机 rootfs 里的 engine.version 比对，不一致就重新解压
          cp android/app/src/main/assets/engine-version.txt android/app/src/main/assets/engine.version
          cat android/app/src/main/assets/engine.version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Android SDK 组件（用 runner 预装的 SDK，不装已废弃的 tools 包）
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: 安装依赖并同步原生工程
        run: |
          npm ci || npm install
          npm test
          npx cap sync android

      - name: 解开正式签名 keystore（配了 secret 才有）
        if: ${{ secrets.MATHAPP_KEYSTORE_B64 != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "${{ secrets.MATHAPP_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/ks/mathapp.p12"
          echo "MATHAPP_KEYSTORE=$RUNNER_TEMP/ks/mathapp.p12" >> "$GITHUB_ENV"
          echo "MATHAPP_STOREPASS=${{ secrets.MATHAPP_STOREPASS }}" >> "$GITHUB_ENV"
          echo "MATHAPP_ALIAS=${{ secrets.MATHAPP_ALIAS }}" >> "$GITHUB_ENV"
          echo "MATHAPP_KEYPASS=${{ secrets.MATHAPP_KEYPASS }}" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/ks/mathapp.p12"

      - name: 编译 APK（有签名出 release，没有就出 debug）
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$MATHAPP_KEYSTORE" ]; then
            echo "用正式 keystore 签名：assembleRelease"
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "没配签名 secret：出 debug 包"
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
          ls -lh app/build/outputs/apk/*/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mathapp-apk
          path: android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: 发布到 Release（单文件 APK，一个链接就能下）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 数学答疑 完整版 v1.0.${{ github.run_number }}
          body: |
            单文件完整版：APK 内置引擎包，首次启动自动解压（约 645 MB，2–5 分钟）。
            引擎：sympy 1.14 / z3 5.4.1 / python-flint(Arb) 0.9 / PARI 2.15.4 / numpy 2.5.4 / OR-Tools CP-SAT 9.15 / cvc5 1.4.2 + Gröbner。
            装机：装 APK → 打开 → 等引擎卡走完 → 设置里填 OpenAI 兼容端点与 Key。
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

  engine-pack:
    name: 引擎包（arm64 rootfs + 七引擎）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 准备 debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap

      - name: 造 rootfs.tar.gz
        run: |
          cd pack
          chmod +x build_engine_pack.sh
          ./build_engine_pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: engine-pack
          path: |
            pack/rootfs.tar.gz*
            pack/engine-version.txt
          if-no-files-found: error

  engine-tests:
    name: 引擎回归（arm64 runner，38 条用例）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装验证引擎
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
          python -m pip install --upgrade pip
          python -m pip install sympy==1.14.0 z3-solver==5.4.1.0 python-flint==0.9.0 \
            numpy==2.5.4 ortools==9.15.6755 cvc5==1.4.2

      - name: 跑引擎回归
        run: python server/test_engine.py
