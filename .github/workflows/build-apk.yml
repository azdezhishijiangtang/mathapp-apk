name: build-apk

# 本地没有 JDK / Android SDK，所以 APK 只能在云端出。
# 手动触发一次即可：Actions → build-apk → Run workflow
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    name: APK（完整版外壳，含 proot 运行时）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖并同步 web 资源
        run: |
          npm ci || npm install
          chmod +x sync_www.sh
          ./sync_www.sh
          npx cap sync android

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mathapp-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  engine-pack:
    name: 引擎包（arm64 rootfs + 七引擎）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 准备 debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap

      - name: 造 rootfs.tar.gz
        run: |
          cd pack
          chmod +x build_engine_pack.sh
          ./build_engine_pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: engine-pack
          path: pack/rootfs.tar.gz*
          if-no-files-found: error
